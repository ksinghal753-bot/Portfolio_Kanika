<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="storeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090E1A"/>
      <stop offset="100%" stop-color="#04060B"/>
    </linearGradient>
    <linearGradient id="storeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#storeBg)"/>
  
  <!-- Window Header -->
  <rect width="800" height="40" rx="16" fill="#101826"/>
  <circle cx="25" cy="20" r="5" fill="#EF4444"/>
  <circle cx="45" cy="20" r="5" fill="#F59E0B"/>
  <circle cx="65" cy="20" r="5" fill="#10B981"/>
  <text x="400" y="24" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94A3B8" text-anchor="middle">store_inventory_pos.py — Python Tkinter + PostgreSQL</text>

  <!-- Metric Cards Top Row -->
  <g transform="translate(30, 60)">
    <rect width="220" height="90" rx="10" fill="#0C1424" stroke="rgba(59,130,246,0.3)"/>
    <text x="20" y="30" font-family="'JetBrains Mono', monospace" font-size="10" fill="#93C5FD">TOTAL INVENTORY VALUE</text>
    <text x="20" y="65" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="bold" fill="#F8FAFC">₹4,82,500</text>
    <text x="140" y="65" font-family="'JetBrains Mono', monospace" font-size="11" fill="#34D399">+14.2%</text>
  </g>

  <g transform="translate(290, 60)">
    <rect width="220" height="90" rx="10" fill="#0C1424" stroke="rgba(139,92,246,0.3)"/>
    <text x="20" y="30" font-family="'JetBrains Mono', monospace" font-size="10" fill="#C084FC">ACTIVE SKU STOCK</text>
    <text x="20" y="65" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="bold" fill="#F8FAFC">1,248 Items</text>
    <text x="150" y="65" font-family="'JetBrains Mono', monospace" font-size="11" fill="#60A5FA">98.4% in-stock</text>
  </g>

  <g transform="translate(550, 60)">
    <rect width="220" height="90" rx="10" fill="#0C1424" stroke="rgba(16,185,129,0.3)"/>
    <text x="20" y="30" font-family="'JetBrains Mono', monospace" font-size="10" fill="#6EE7B7">DAILY TRANSACTIONS</text>
    <text x="20" y="65" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="bold" fill="#F8FAFC">184 Orders</text>
    <text x="150" y="65" font-family="'JetBrains Mono', monospace" font-size="11" fill="#34D399">Real-time</text>
  </g>

  <!-- Inventory Grid -->
  <rect x="30" y="170" width="460" height="295" rx="10" fill="#0A0F1A" stroke="rgba(255,255,255,0.06)"/>
  <text x="50" y="200" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold" fill="#F8FAFC">Live Inventory Ledger</text>
  
  <rect x="50" y="220" width="420" height="24" fill="#141E30"/>
  <text x="60" y="236" font-family="'JetBrains Mono', monospace" font-size="10" fill="#93C5FD">ITEM CODE</text>
  <text x="170" y="236" font-family="'JetBrains Mono', monospace" font-size="10" fill="#93C5FD">NAME</text>
  <text x="310" y="236" font-family="'JetBrains Mono', monospace" font-size="10" fill="#93C5FD">QTY</text>
  <text x="390" y="236" font-family="'JetBrains Mono', monospace" font-size="10" fill="#93C5FD">STATUS</text>

  <!-- Row 1 -->
  <text x="60" y="270" font-family="'JetBrains Mono', monospace" font-size="11" fill="#60A5FA">SKU-9402</text>
  <text x="170" y="270" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#E2E8F0">Hydraulic Coupler A</text>
  <text x="310" y="270" font-family="'JetBrains Mono', monospace" font-size="11" fill="#F8FAFC">45 pcs</text>
  <rect x="390" y="258" width="60" height="18" rx="9" fill="rgba(16,185,129,0.2)"/>
  <text x="420" y="271" font-family="'JetBrains Mono', monospace" font-size="9" fill="#34D399" text-anchor="middle">OPTIMAL</text>

  <!-- Row 2 -->
  <text x="60" y="310" font-family="'JetBrains Mono', monospace" font-size="11" fill="#60A5FA">SKU-7721</text>
  <text x="170" y="310" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#E2E8F0">Circuit Assembly P2</text>
  <text x="310" y="310" font-family="'JetBrains Mono', monospace" font-size="11" fill="#F8FAFC">08 pcs</text>
  <rect x="390" y="298" width="60" height="18" rx="9" fill="rgba(245,158,11,0.2)"/>
  <text x="420" y="311" font-family="'JetBrains Mono', monospace" font-size="9" fill="#FBBF24" text-anchor="middle">LOW</text>

  <!-- Row 3 -->
  <text x="60" y="350" font-family="'JetBrains Mono', monospace" font-size="11" fill="#60A5FA">SKU-3120</text>
  <text x="170" y="350" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#E2E8F0">Industrial Sensor X</text>
  <text x="310" y="350" font-family="'JetBrains Mono', monospace" font-size="11" fill="#F8FAFC">120 pcs</text>
  <rect x="390" y="338" width="60" height="18" rx="9" fill="rgba(16,185,129,0.2)"/>
  <text x="420" y="351" font-family="'JetBrains Mono', monospace" font-size="9" fill="#34D399" text-anchor="middle">OPTIMAL</text>

  <!-- Side Control Panel -->
  <rect x="510" y="170" width="260" height="295" rx="10" fill="#0A0F1A" stroke="rgba(255,255,255,0.06)"/>
  <text x="530" y="200" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold" fill="#F8FAFC">Quick Operations</text>
  <rect x="530" y="220" width="220" height="40" rx="8" fill="#2563EB"/>
  <text x="640" y="245" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">⚡ Check In / Stock In</text>

  <rect x="530" y="275" width="220" height="40" rx="8" fill="#1E293B" stroke="rgba(255,255,255,0.1)"/>
  <text x="640" y="300" font-family="'JetBrains Mono', monospace" font-size="12" fill="#E2E8F0" text-anchor="middle">📦 Dispatch / Issue Item</text>

  <rect x="530" y="330" width="220" height="40" rx="8" fill="#1E293B" stroke="rgba(255,255,255,0.1)"/>
  <text x="640" y="355" font-family="'JetBrains Mono', monospace" font-size="12" fill="#E2E8F0" text-anchor="middle">📊 Export Audit Report</text>
</svg>
