<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="easyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140D24"/>
      <stop offset="100%" stop-color="#07050E"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#easyBg)"/>
  
  <!-- Browser Frame Header -->
  <rect width="800" height="40" rx="16" fill="#1C1430"/>
  <circle cx="25" cy="20" r="5" fill="#EF4444"/>
  <circle cx="45" cy="20" r="5" fill="#F59E0B"/>
  <circle cx="65" cy="20" r="5" fill="#10B981"/>
  <rect x="180" y="8" width="440" height="24" rx="12" fill="#0C0818"/>
  <text x="400" y="24" font-family="'JetBrains Mono', monospace" font-size="11" fill="#C084FC" text-anchor="middle">https://easydo.app/kanika/workspace</text>

  <!-- Navigation Bar inside app -->
  <g transform="translate(40, 60)">
    <text x="0" y="30" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">Easy<tspan fill="#A855F7">Do</tspan></text>
    <text x="120" y="28" font-family="'Space Grotesk', sans-serif" font-size="13" fill="#94A3B8">Today's Focus</text>
    <text x="240" y="28" font-family="'Space Grotesk', sans-serif" font-size="13" fill="#64748B">Upcoming</text>
    <text x="340" y="28" font-family="'Space Grotesk', sans-serif" font-size="13" fill="#64748B">Completed</text>
    
    <!-- Quick Add Input -->
    <rect x="460" y="5" width="260" height="35" rx="8" fill="#1B152B" stroke="rgba(168,85,247,0.3)"/>
    <text x="480" y="27" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#64748B">+ Add task or hit Enter...</text>
  </g>

  <!-- Kanban / Task Cards Columns -->
  <!-- Column 1: Priority Tasks -->
  <g transform="translate(40, 125)">
    <rect width="225" height="340" rx="12" fill="#0F0A1C" stroke="rgba(168,85,247,0.2)"/>
    <circle cx="20" cy="25" r="4" fill="#EF4444"/>
    <text x="35" y="29" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold" fill="#F8FAFC">HIGH PRIORITY</text>
    <text x="195" y="29" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">3</text>

    <!-- Card 1 -->
    <rect x="15" y="50" width="195" height="80" rx="8" fill="#1C1430" stroke="rgba(255,255,255,0.06)"/>
    <text x="28" y="75" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600" fill="#F8FAFC">Design Database Schema</text>
    <text x="28" y="95" font-family="'JetBrains Mono', monospace" font-size="10" fill="#A855F7">⚡ Core Architecture</text>
    <text x="28" y="115" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748B">Due today 18:00</text>

    <!-- Card 2 -->
    <rect x="15" y="140" width="195" height="80" rx="8" fill="#1C1430" stroke="rgba(255,255,255,0.06)"/>
    <text x="28" y="165" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600" fill="#F8FAFC">Implement JWT Auth</text>
    <text x="28" y="185" font-family="'JetBrains Mono', monospace" font-size="10" fill="#3B82F6">🔒 Security API</text>
    <text x="28" y="205" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748B">Tomorrow</text>
  </g>

  <!-- Column 2: In Progress -->
  <g transform="translate(285, 125)">
    <rect width="225" height="340" rx="12" fill="#0F0A1C" stroke="rgba(59,130,246,0.2)"/>
    <circle cx="20" cy="25" r="4" fill="#3B82F6"/>
    <text x="35" y="29" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold" fill="#F8FAFC">IN PROGRESS</text>
    <text x="195" y="29" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">2</text>

    <!-- Card 1 -->
    <rect x="15" y="50" width="195" height="80" rx="8" fill="#151A2E" stroke="rgba(255,255,255,0.06)"/>
    <text x="28" y="75" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600" fill="#F8FAFC">Optimize CSS Animation</text>
    <text x="28" y="95" font-family="'JetBrains Mono', monospace" font-size="10" fill="#06B6D4">🎨 Frontend UI</text>
    <text x="28" y="115" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748B">60fps Target</text>
  </g>

  <!-- Column 3: Completed -->
  <g transform="translate(530, 125)">
    <rect width="230" height="340" rx="12" fill="#0F0A1C" stroke="rgba(16,185,129,0.2)"/>
    <circle cx="20" cy="25" r="4" fill="#10B981"/>
    <text x="35" y="29" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold" fill="#F8FAFC">DONE</text>
    <text x="200" y="29" font-family="'JetBrains Mono', monospace" font-size="11" fill="#34D399">✓ 14</text>

    <!-- Card 1 -->
    <rect x="15" y="50" width="200" height="70" rx="8" fill="#0E1A16" stroke="rgba(16,185,129,0.2)"/>
    <text x="28" y="75" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600" fill="#94A3B8" text-decoration="line-through">Setup Vite + Tailwind</text>
    <text x="28" y="98" font-family="'JetBrains Mono', monospace" font-size="10" fill="#34D399">✓ Completed</text>
  </g>
</svg>
