<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="todoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080816"/>
      <stop offset="50%" stop-color="#120A2A"/>
      <stop offset="100%" stop-color="#05030A"/>
    </linearGradient>
    <linearGradient id="neonBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#todoBg)"/>
  
  <!-- Window Header -->
  <rect width="800" height="48" rx="16" fill="#0E0C1E"/>
  <circle cx="28" cy="24" r="6" fill="#EF4444"/>
  <circle cx="48" cy="24" r="6" fill="#F59E0B"/>
  <circle cx="68" cy="24" r="6" fill="#10B981"/>
  <text x="400" y="28" fill="#A1A1AA" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" text-anchor="middle">EASYDO // AI_INTEGRATED_TODO_LIST</text>

  <!-- Left Sidebar / Smart Categories -->
  <rect x="30" y="70" width="220" height="395" rx="12" fill="#0C0A1A" stroke="#2E1065" stroke-width="1"/>
  <text x="50" y="105" fill="#C084FC" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">AI SMART FILTERS</text>
  
  <rect x="45" y="125" width="190" height="36" rx="8" fill="#8B5CF6" fill-opacity="0.2" stroke="#8B5CF6" stroke-width="1"/>
  <text x="60" y="148" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" font-weight="bold">⚡ High Priority (AI Auto)</text>
  
  <rect x="45" y="172" width="190" height="36" rx="8" fill="#18152E"/>
  <text x="60" y="195" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">🧠 Deep Work Tasks</text>

  <rect x="45" y="219" width="190" height="36" rx="8" fill="#18152E"/>
  <text x="60" y="242" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">📅 Scheduled Sprints</text>

  <rect x="45" y="266" width="190" height="36" rx="8" fill="#18152E"/>
  <text x="60" y="289" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">✅ Completed (18)</text>

  <!-- AI Suggestions Card in sidebar -->
  <rect x="45" y="325" width="190" height="120" rx="10" fill="#1E1338" stroke="#A855F7" stroke-width="1"/>
  <text x="60" y="350" fill="#E9D5FF" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">✨ AI INSIGHTS</text>
  <text x="60" y="375" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="10">DSA practice allocated for peak morning hours.</text>

  <!-- Main Tasks Board -->
  <rect x="270" y="70" width="500" height="395" rx="12" fill="#0A0818" stroke="#1E1938" stroke-width="1"/>
  
  <!-- Add Task Bar -->
  <rect x="290" y="90" width="460" height="42" rx="10" fill="#141126" stroke="#3B82F6" stroke-width="1"/>
  <text x="310" y="116" fill="#64748B" font-family="'Inter', sans-serif" font-size="12">Type task description (e.g., 'Prepare DSA Binary Trees for tomorrow 10am')...</text>

  <!-- Task Cards -->
  <g transform="translate(290, 150)">
    <rect width="460" height="64" rx="10" fill="#15112B" stroke="#8B5CF6" stroke-width="1.5"/>
    <circle cx="25" cy="32" r="10" fill="none" stroke="#10B981" stroke-width="2"/>
    <text x="50" y="28" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="13" font-weight="bold">Master Graphs &amp; Dynamic Programming Algorithms</text>
    <text x="50" y="48" fill="#A855F7" font-family="'JetBrains Mono', monospace" font-size="10">AI CATEGORY: CORE_DSA • PRIORITY: CRITICAL (Score: 98)</text>
    <rect x="375" y="20" width="70" height="24" rx="6" fill="#8B5CF6" fill-opacity="0.3"/>
    <text x="410" y="36" fill="#E9D5FF" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">URGENT</text>
  </g>

  <g transform="translate(290, 225)">
    <rect width="460" height="64" rx="10" fill="#120E24" stroke="#251F45" stroke-width="1"/>
    <circle cx="25" cy="32" r="10" fill="none" stroke="#64748B" stroke-width="2"/>
    <text x="50" y="28" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="13" font-weight="bold">Complete Cisco CyberOps Network Security Module</text>
    <text x="50" y="48" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="10">AI CATEGORY: CYBERSECURITY • STATUS: IN_PROGRESS</text>
    <rect x="375" y="20" width="70" height="24" rx="6" fill="#0284C7" fill-opacity="0.3"/>
    <text x="410" y="36" fill="#7DD3FC" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">ACTIVE</text>
  </g>

  <g transform="translate(290, 300)">
    <rect width="460" height="64" rx="10" fill="#120E24" stroke="#251F45" stroke-width="1"/>
    <circle cx="25" cy="32" r="10" fill="#10B981"/>
    <path d="M21 32 L24 35 L29 29" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <text x="50" y="28" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="13" text-decoration="line-through">Deploy Interactive Developer Portfolio Interface</text>
    <text x="50" y="48" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="10">AI CATEGORY: WEB_SYSTEMS • COMPLETED</text>
  </g>

  <g transform="translate(290, 375)">
    <rect width="460" height="64" rx="10" fill="#120E24" stroke="#251F45" stroke-width="1"/>
    <circle cx="25" cy="32" r="10" fill="#10B981"/>
    <path d="M21 32 L24 35 L29 29" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <text x="50" y="28" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="13" text-decoration="line-through">Python Scaler Data Structures Exercises</text>
    <text x="50" y="48" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="10">AI CATEGORY: PYTHON • COMPLETED</text>
  </g>
</svg>
