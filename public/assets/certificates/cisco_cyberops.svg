<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040814"/>
      <stop offset="50%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#02040A"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="600" height="400" rx="16" fill="url(#bgGrad)" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.3"/>
  
  <!-- Cyber Grid -->
  <g opacity="0.08" stroke="#38BDF8" stroke-width="1">
    <line x1="0" y1="80" x2="600" y2="80"/>
    <line x1="0" y1="160" x2="600" y2="160"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="320" x2="600" y2="320"/>
    <line x1="120" y1="0" x2="120" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="360" y1="0" x2="360" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/>
  </g>

  <!-- Security Shield & Circuit Icon -->
  <g transform="translate(300, 140)" filter="url(#glow)">
    <circle cx="0" cy="0" r="50" fill="#0C1B33" stroke="#06B6D4" stroke-width="2"/>
    <path d="M0 -30 L25 -15 L25 15 L0 30 L-25 15 L-25 -15 Z" fill="none" stroke="#38BDF8" stroke-width="2.5"/>
    <path d="M-12 -5 L0 10 L15 -10" fill="none" stroke="#22D3EE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="0" cy="0" r="35" fill="none" stroke="#8B5CF6" stroke-width="1" stroke-dasharray="4 4"/>
  </g>

  <!-- Cisco / CyberOps Badge -->
  <rect x="40" y="35" width="130" height="24" rx="12" fill="#06B6D4" fill-opacity="0.15" stroke="#06B6D4" stroke-width="1"/>
  <text x="105" y="51" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle" letter-spacing="1">CISCO ACADEMY</text>

  <text x="300" y="225" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="22" font-weight="bold" text-anchor="middle" letter-spacing="1">CyberOps Associate</text>
  <text x="300" y="250" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="13" text-anchor="middle">Cisco Networking Academy • Verified Credential</text>
  
  <text x="300" y="295" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle" letter-spacing="2">SECURITY MONITORING • INCIDENT RESPONSE • THREAT DETECTION</text>

  <!-- Footer Verification Badge -->
  <line x1="60" y1="340" x2="540" y2="340" stroke="#1E293B" stroke-width="1"/>
  <text x="60" y="365" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10">RECIPIENT: KANIKA SINGHAL</text>
  <text x="540" y="365" fill="#06B6D4" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="end">CREDENTIAL ID: CISCO-CYBER-OPS</text>
</svg>
