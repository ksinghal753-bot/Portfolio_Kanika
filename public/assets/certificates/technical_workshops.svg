<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="workshopBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#031518"/>
      <stop offset="50%" stop-color="#061E24"/>
      <stop offset="100%" stop-color="#02090C"/>
    </linearGradient>
    <filter id="wsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="600" height="400" rx="16" fill="url(#workshopBg)" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Workshop Badge -->
  <rect x="40" y="35" width="150" height="24" rx="12" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1"/>
  <text x="115" y="51" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle" letter-spacing="1">INDUSTRY WORKSHOPS</text>

  <!-- Workshop Gears/Tools Icon -->
  <g transform="translate(300, 140)" filter="url(#wsGlow)">
    <circle cx="0" cy="0" r="50" fill="#062822" stroke="#10B981" stroke-width="2"/>
    <path d="M-15 -10 L15 10 M-15 10 L15 -10" stroke="#34D399" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="20" fill="none" stroke="#6EE7B7" stroke-width="2" stroke-dasharray="6 3"/>
    <circle cx="0" cy="0" r="8" fill="#10B981"/>
  </g>

  <text x="300" y="225" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="22" font-weight="bold" text-anchor="middle">Technical Workshop Certificates</text>
  <text x="300" y="250" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="13" text-anchor="middle">Various Organizers • Hands-on Engineering Seminars</text>
  
  <text x="300" y="295" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle" letter-spacing="2">EMERGING TECHNOLOGIES • PRACTICAL IMPLEMENTATION</text>

  <!-- Footer Verification Badge -->
  <line x1="60" y1="340" x2="540" y2="340" stroke="#064E3B" stroke-width="1"/>
  <text x="60" y="365" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10">RECIPIENT: KANIKA SINGHAL</text>
  <text x="540" y="365" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="end">CREDENTIAL ID: WORKSHOP-SERIES-2024</text>
</svg>
