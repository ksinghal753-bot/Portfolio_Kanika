<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0F1A"/>
      <stop offset="50%" stop-color="#08080E"/>
      <stop offset="100%" stop-color="#030305"/>
    </linearGradient>
    <linearGradient id="cyberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.3"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#3B82F6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#030305" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="700" fill="url(#bgGrad)" rx="24"/>
  <rect width="600" height="700" fill="url(#aura)"/>

  <!-- High-tech Grid Background -->
  <g opacity="0.15">
    <path d="M 0 100 L 600 100 M 0 200 L 600 200 M 0 300 L 600 300 M 0 400 L 600 400 M 0 500 L 600 500 M 0 600 L 600 600" stroke="#8B5CF6" stroke-width="1" stroke-dasharray="4,8"/>
    <path d="M 100 0 L 100 700 M 200 0 L 200 700 M 300 0 L 300 700 M 400 0 L 400 700 M 500 0 L 500 700" stroke="#3B82F6" stroke-width="1" stroke-dasharray="4,8"/>
  </g>

  <!-- Cybernetic Silhouette / Developer Avatar Composition -->
  <g transform="translate(300, 320)">
    <!-- Halo ring -->
    <circle r="140" fill="none" stroke="url(#cyberGlow)" stroke-width="2" opacity="0.6" stroke-dasharray="12,6"/>
    <circle r="155" fill="none" stroke="#8B5CF6" stroke-width="1" opacity="0.3"/>
    
    <!-- Ambient avatar head & body representation -->
    <circle cy="-40" r="65" fill="#141422" stroke="url(#circleGrad)" stroke-width="3" filter="url(#glowFilter)"/>
    <path d="M -110 160 C -110 80, 110 80, 110 160 Z" fill="#141422" stroke="url(#cyberGlow)" stroke-width="3"/>

    <!-- Developer Monogram & Interface Symbols -->
    <text x="0" y="-30" font-family="'Space Grotesk', sans-serif" font-size="34" font-weight="bold" fill="#F5F5F7" text-anchor="middle" letter-spacing="2">KS</text>
    <text x="0" y="5" font-family="'JetBrains Mono', monospace" font-size="12" fill="#A855F7" text-anchor="middle" letter-spacing="4">SYS://OPERATOR</text>
  </g>

  <!-- Overlay Frame Elements -->
  <rect x="20" y="20" width="560" height="660" rx="18" fill="none" stroke="url(#cyberGlow)" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Corner Tech Reticles -->
  <path d="M 20 50 L 20 20 L 50 20" fill="none" stroke="#A855F7" stroke-width="3"/>
  <path d="M 580 50 L 580 20 L 550 20" fill="none" stroke="#A855F7" stroke-width="3"/>
  <path d="M 20 650 L 20 680 L 50 680" fill="none" stroke="#3B82F6" stroke-width="3"/>
  <path d="M 580 650 L 580 680 L 550 680" fill="none" stroke="#3B82F6" stroke-width="3"/>

  <!-- Status badges -->
  <g transform="translate(40, 640)">
    <rect width="180" height="32" rx="16" fill="rgba(12,12,18,0.85)" stroke="rgba(139,92,246,0.5)" stroke-width="1"/>
    <circle cx="20" cy="16" r="4" fill="#10B981"/>
    <text x="35" y="20" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#E2E8F0">PORTFOLIO PHOTO</text>
  </g>

  <g transform="translate(380, 640)">
    <rect width="180" height="32" rx="16" fill="rgba(12,12,18,0.85)" stroke="rgba(59,130,246,0.5)" stroke-width="1"/>
    <text x="90" y="20" font-family="'JetBrains Mono', monospace" font-size="11" fill="#93C5FD" text-anchor="middle">KANIKA SINGHAL</text>
  </g>
</svg>
